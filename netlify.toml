# TripFit — Netlify Static Site Deployment Configuration

[build]
  # No build command needed — pure HTML/CSS/JS static site
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

# SPA-style: serve index.html for unknown paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
