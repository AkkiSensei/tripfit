<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Matches • TripFit</title>
    
    <link rel="icon" href="logo/TripFit_logo2-removebg-preview.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mint: '#2dd4bf',
                        teal: '#14b8a6',
                        juniper: '#0f373b',
                        pearl: '#f8f9fa',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-pearl dark:bg-gray-900 min-h-screen flex flex-col text-gray-800 dark:text-gray-100 transition-colors duration-300">

    <!-- Header -->
    <header class="bg-juniper text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="home.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
                <img src="logo/TripFit_logo2-removebg-preview.png" alt="TripFit Logo" style="height: 60px; margin-right: 5px; object-fit: contain;">
                <div class="text-3xl font-bold tracking-tight">TripFit</div>
            </a>
            <nav class="hidden md:flex items-center gap-x-6 font-medium">
                <a href="home.html" class="hover:text-mint transition-colors">Home</a>
                <a href="all-destinations.html" class="hover:text-mint transition-colors">Destinations</a>
                <a href="history.html" class="hover:text-mint transition-colors flex items-center gap-2">
                    <i class="fas fa-history text-lg"></i>
                    <span>History</span>
                </a>

                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-700 transition-colors">
                    <i class="fas fa-moon text-xl" id="theme-icon"></i>
                </button>

                <a href="quiz.html" class="px-6 py-2.5 bg-mint hover:bg-teal text-juniper rounded-full font-bold transition-all shadow-lg">
                    Retake Quiz
                </a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-white dark:bg-gray-800 py-16 px-6 text-center border-b border-gray-200 dark:border-gray-700 transition-colors">
        <div class="max-w-3xl mx-auto">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-mint/20 text-mint rounded-full mb-6 text-3xl">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-juniper dark:text-white tracking-tight mb-4">Your Perfect Matches</h1>
            <p class="text-lg text-gray-600 dark:text-gray-400">Based on your unique vibe, we have calculated the top destinations for your next escape.</p>
        </div>
    </section>

    <!-- Main Results Section -->
    <section class="py-16 px-6 flex-1">
        <div class="max-w-7xl mx-auto">
            
            <!-- Loading State -->
            <div id="analyzing-loading" class="text-center py-16">
                <div class="inline-block animate-spin text-5xl text-mint mb-6">⟳</div>
                <p class="text-2xl font-bold text-juniper">Analyzing your travel profile...</p>
                <p class="text-gray-500 mt-2">Finding your perfect matches</p>
            </div>

            <!-- Results Grid (cards will be injected here) -->
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-8">
                <!-- Populated by script.js -->
            </div>

            <div class="mt-16 text-center">
                <p class="text-gray-500 dark:text-gray-400 mb-6">Want to explore more options?</p>
                <a href="all-destinations.html" 
                   class="inline-block px-8 py-4 border-2 border-juniper dark:border-mint text-juniper dark:text-mint hover:bg-juniper dark:hover:bg-mint hover:text-white dark:hover:text-juniper font-bold rounded-xl transition-all">
                    View Entire Catalog
                </a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        if (localStorage.getItem('tripfit-theme') === 'dark') {
            document.documentElement.classList.add('dark');
            if (themeIcon) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                if (themeIcon) {
                    themeIcon.classList.toggle('fa-moon', !isDark);
                    themeIcon.classList.toggle('fa-sun', isDark);
                }
                try { 
                    localStorage.setItem('tripfit-theme', isDark ? 'dark' : 'light'); 
                } catch(e) {}
            });
        }

        // Render recommendations immediately
        if (typeof renderRecommendationResults === 'function') {
            renderRecommendationResults();
        }

        // Also save to history
        if (typeof trySaveRecommendationSnapshot === 'function') {
            trySaveRecommendationSnapshot();
        }
    </script>
</body>
</html>
